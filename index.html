<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de Acessos | Suntech & Avatek</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .select-sim { color: #10b981; font-weight: 700; }
        .select-nao { color: #ef4444; font-weight: 700; }
        .glass-nav { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-900 min-h-screen pb-10">

    <nav class="sticky top-0 z-50 glass-nav">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center shadow-lg text-white">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <div>
                        <span class="text-lg font-bold block leading-none">Gestão de <span class="text-indigo-600">Acessos</span></span>
                        <span id="status-text" class="text-[10px] text-slate-400 uppercase font-bold tracking-widest">Sincronizado</span>
                    </div>
                </div>
                <div class="relative w-1/3">
                    <input type="text" id="filtro-pasta" placeholder="Buscar pasta..." 
                        class="w-full pl-4 pr-4 py-2 bg-slate-100 border-none rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none transition-all">
                </div>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <div id="loading" class="py-20 text-center">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <p class="text-slate-400 text-sm font-medium animate-pulse">Conectando ao banco de permissões...</p>
        </div>

        <div id="tabela-container" class="hidden bg-white rounded-3xl border border-slate-200 shadow-xl overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left">
                    <thead>
                        <tr id="table-head" class="bg-slate-50 border-b border-slate-200 text-[10px] uppercase font-bold tracking-widest text-slate-400">
                            </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-100 text-sm text-slate-600">
                        </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwAt-FKX6a6YqlRfduix3DoAwJHQgF6pO8kXRCA18NJiTkHQ1jE_40i1Tjniq-QOoWh/exec';
        let dadosLocais = [];

        // Carregar dados iniciais
        async function carregarDados() {
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                dadosLocais = data;
                renderizar(data);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('tabela-container').classList.remove('hidden');
            } catch (err) {
                console.error('Erro ao carregar:', err);
                document.getElementById('loading').innerHTML = `<p class="text-red-500 font-bold">⚠️ Falha ao carregar API do Google.</p>`;
            }
        }

        function renderizar(data) {
            const head = document.getElementById('table-head');
            const body = document.getElementById('table-body');
            
            // Renderiza Header
            head.innerHTML = data.colunas.map(col => `<th class="px-6 py-4 whitespace-nowrap">${col}</th>`).join('');

            // Renderiza Body
            body.innerHTML = data.rows.map(row => {
                return `<tr class="hover:bg-slate-50 transition-colors">
                    ${data.colunas.map(col => {
                        const valor = String(row[col]).trim().toUpperCase();
                        const isStatic = (col === 'RAIZ' || col === 'PASTAS');

                        if (isStatic) {
                            return `<td class="px-6 py-4 font-bold text-slate-700 bg-slate-50/30">${row[col]}</td>`;
                        } else {
                            return `<td class="px-6 py-4">
                                <select 
                                    onchange="salvarAlteracao(${row.rowId}, '${col}', this)"
                                    class="bg-transparent border-none focus:ring-0 cursor-pointer ${valor === 'SIM' ? 'select-sim' : 'select-nao'}"
                                >
                                    <option value="SIM" ${valor === 'SIM' ? 'selected' : ''}>SIM</option>
                                    <option value="NÃO" ${valor === 'NÃO' || valor === 'NAO' ? 'selected' : ''}>NÃO</option>
                                </select>
                            </td>`;
                        }
                    }).join('')}
                </tr>`;
            }).join('');
        }

        async function salvarAlteracao(rowId, usuario, selectEl) {
            const status = document.getElementById('status-text');
            const novoValor = selectEl.value;

            // Feedback visual
            status.innerText = 'Salvando alterações...';
            status.classList.remove('text-slate-400');
            status.classList.add('text-indigo-600', 'animate-pulse');
            selectEl.classList.add('opacity-30');

            try {
                // Como GAS não suporta CORS para POST de domínios externos facilmente com JSON, 
                // usamos mode: 'no-cors'. O Google processará, mas não teremos o corpo da resposta.
                await fetch(API_URL, {
                    method: 'POST',
                    mode: 'no-cors', 
                    cache: 'no-cache',
                    body: JSON.stringify({
                        rowId: rowId,
                        colunaNome: usuario,
                        novoValor: novoValor
                    })
                });

                // Atualiza cor do select localmente
                selectEl.className = `bg-transparent border-none focus:ring-0 cursor-pointer ${novoValor === 'SIM' ? 'select-sim' : 'select-nao'}`;
                
                setTimeout(() => {
                    status.innerText = 'Sincronizado';
                    status.classList.add('text-slate-400');
                    status.classList.remove('text-indigo-600', 'animate-pulse');
                    selectEl.classList.remove('opacity-30');
                }, 1000);

            } catch (err) {
                console.error('Erro ao salvar:', err);
                status.innerText = 'Erro ao salvar!';
                status.classList.add('text-red-500');
                selectEl.classList.remove('opacity-30');
            }
        }

        // Filtro de busca
        document.getElementById('filtro-pasta').addEventListener('input', (e) => {
            const termo = e.target.value.toLowerCase();
            const filtrados = {
                ...dadosLocais,
                rows: dadosLocais.rows.filter(row => 
                    String(row.PASTAS).toLowerCase().includes(termo) || 
                    String(row.RAIZ).toLowerCase().includes(termo)
                )
            };
            renderizar(filtrados);
        });

        carregarDados();
    </script>
</body>
</html>
