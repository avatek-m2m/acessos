<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Acessos AVATEK</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .select-sim { color: #10b981 !important; font-weight: 800; }
        .select-nao { color: #ef4444 !important; font-weight: 500; }
        .group-header { background: #f8fafc; border-left: 4px solid #4f46e5; }
        .sticky-col { position: sticky; left: 0; background: white; z-index: 10; border-right: 2px solid #f1f5f9; }
    </style>
</head>
<body class="bg-[#f1f5f9] min-h-screen pb-20">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 px-6 py-4 shadow-sm">
        <div class="max-w-full mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white shadow-lg">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-slate-800 leading-none">Controle de <span class="text-indigo-600">Acessos</span></h1>
                    <p id="status" class="text-[10px] text-slate-400 font-bold uppercase mt-1">Status: Conectado</p>
                </div>
            </div>
            <div id="filtros" class="flex gap-2 overflow-x-auto max-w-full pb-2"></div>
        </div>
    </nav>

    <main class="p-6">
        <div id="loading" class="text-center py-20">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-indigo-600 border-t-transparent mb-4"></div>
            <p class="text-slate-500 font-medium">Validando permissões da planilha...</p>
        </div>

        <div id="container" class="hidden bg-white rounded-2xl shadow-xl border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left text-sm border-separate border-spacing-0">
                    <thead class="sticky top-0 z-30">
                        <tr id="thead" class="bg-slate-800 text-white text-[10px] uppercase font-bold tracking-widest"></tr>
                    </thead>
                    <tbody id="tbody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        const API_URL = 'https://script.google.com/macros/s/AKfycbwhthBzrBBVFNfTHCsZa398URTvV7-maAsXQZfP5Im-XD4YY-0BE_yFUQQvi-JxWULS/exec';
        let dadosOriginais = null;
        let pessoaFiltro = 'TODOS';

        async function carregar() {
            try {
                const r = await fetch(API_URL);
                dadosOriginais = await r.json();
                renderizarFiltros();
                renderizarTabela();
            } catch (e) {
                document.getElementById('loading').innerHTML = '<p class="text-red-500">Erro de conexão.</p>';
            }
        }

        function renderizarFiltros() {
            const container = document.getElementById('filtros');
            const nomes = dadosOriginais.colunas.filter(c => !['RAIZ', 'PASTAS'].includes(c));
            let html = `<button onclick="setFiltro('TODOS')" class="px-4 py-1.5 rounded-full text-[10px] font-bold border ${pessoaFiltro === 'TODOS' ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}">TODOS</button>`;
            nomes.forEach(n => {
                html += `<button onclick="setFiltro('${n}')" class="px-4 py-1.5 rounded-full text-[10px] font-bold border whitespace-nowrap ${pessoaFiltro === n ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-slate-500 border-slate-200'}">${n}</button>`;
            });
            container.innerHTML = html;
        }

        function setFiltro(nome) {
            pessoaFiltro = nome;
            renderizarFiltros();
            renderizarTabela();
        }

        function renderizarTabela() {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('container').classList.remove('hidden');

            const head = document.getElementById('thead');
            const body = document.getElementById('tbody');
            const cols = pessoaFiltro === 'TODOS' ? dadosOriginais.colunas : ['RAIZ', 'PASTAS', pessoaFiltro];

            head.innerHTML = cols.map(c => `<th class="px-6 py-4 whitespace-nowrap">${c}</th>`).join('');

            // Agrupamento por RAIZ
            const grupos = {};
            dadosOriginais.rows.forEach(r => {
                const rKey = r.RAIZ || 'GERAL';
                if (!grupos[rKey]) grupos[rKey] = [];
                grupos[rKey].push(r);
            });

            let html = '';
            Object.keys(grupos).sort().forEach(raiz => {
                html += `<tr class="group-header"><td colspan="${cols.length}" class="px-6 py-2 text-[11px] font-black text-indigo-700 bg-indigo-50/50 uppercase tracking-tighter">📁 RAIZ: ${raiz}</td></tr>`;
                
                grupos[raiz].forEach(row => {
                    html += `<tr class="hover:bg-slate-50 transition-colors">`;
                    cols.forEach(col => {
                        const val = String(row[col] || '').trim().toUpperCase();
                        if (col === 'RAIZ') html += `<td class="px-6 py-3 text-slate-400 text-xs">${row[col]}</td>`;
                        else if (col === 'PASTAS') html += `<td class="px-6 py-3 font-bold text-slate-700 sticky-col">${row[col]}</td>`;
                        else {
                            html += `<td class="px-6 py-3">
                                <select onchange="salvar(${row.rowId}, '${col}', this)" class="bg-transparent border-none cursor-pointer focus:ring-0 text-xs font-bold ${val === 'SIM' ? 'select-sim' : 'select-nao'}">
                                    <option value="SIM" ${val === 'SIM' ? 'selected' : ''}>SIM</option>
                                    <option value="NÃO" ${val !== 'SIM' ? 'selected' : ''}>NÃO</option>
                                </select>
                            </td>`;
                        }
                    });
                    html += `</tr>`;
                });
            });
            body.innerHTML = html;
        }

        async function salvar(rowId, col, el) {
            const status = document.getElementById('status');
            const val = el.value;
            status.innerText = 'Salvando...';
            el.classList.add('opacity-20');

            try {
                await fetch(API_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ rowId, colunaNome: col, novoValor: val })});
                el.className = `bg-transparent border-none cursor-pointer focus:ring-0 text-xs font-bold ${val === 'SIM' ? 'select-sim' : 'select-nao'}`;
                status.innerText = 'Sincronizado';
                el.classList.remove('opacity-20');
            } catch (e) { status.innerText = 'Erro ao salvar'; }
        }

        carregar();
    </script>
</body>
</html>
